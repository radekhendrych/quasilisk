<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 50px; font-weight: 800; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 24px; fill: #475569; letter-spacing: 0; }
      .section { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #334155; letter-spacing: 0.8px; text-transform: uppercase; }
      .head { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 27px; font-weight: 800; fill: #0f172a; letter-spacing: 0; }
      .subhead { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #334155; letter-spacing: 0; }
      .body { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 20px; fill: #334155; letter-spacing: 0; }
      .small { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 17px; fill: #475569; letter-spacing: 0; }
      .mono { font-family: "DejaVu Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #334155; letter-spacing: 0; }
      .label { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #334155; letter-spacing: 0; }
      .num { font-family: Inter, "DejaVu Sans", Arial, sans-serif; font-size: 18px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; }
      .box-green { fill: #ecfdf5; stroke: #86efac; }
      .box-amber { fill: #fffbeb; stroke: #fcd34d; }
      .box-red { fill: #fff1f2; stroke: #fda4af; }
      .box-purple { fill: #f5f3ff; stroke: #c4b5fd; }
      .box-gray { fill: #f1f5f9; stroke: #cbd5e1; }
      .box-dark { fill: #0f172a; stroke: #0f172a; }
      .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 18; }
      .diamond { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .line { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #15803d; stroke-width: 4; marker-end: url(#arrow-green); }
      .line-amber { fill: none; stroke: #b45309; stroke-width: 4; marker-end: url(#arrow-amber); }
      .line-red { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow-red); }
      .line-dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 12 10; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2600" height="1800"/>
  <text class="title" x="80" y="82">Quasilisk Perturbation Procedure</text>
  <text class="subtitle" x="80" y="124">Planned-only perturbation flow: parent selection, defense-aware planning, structured LLM generation, parsing, validation, repair, and candidate handoff.</text>

  <rect class="lane" x="70" y="185" width="2460" height="400"/>
  <text class="section" x="100" y="230">Inputs and Parent Context</text>

  <rect class="box box-blue" x="110" y="260" width="350" height="230"/>
  <text class="head" x="140" y="305">Generation Loop</text>
  <text class="body" x="140" y="348">For each iteration, the runner asks</text>
  <text class="body" x="140" y="380">the archive for planned parents.</text>
  <text class="mono" x="140" y="426">select_planned_parents()</text>
  <text class="small" x="140" y="458">No simple perturbation mode remains.</text>

  <rect class="box box-green" x="550" y="260" width="410" height="230"/>
  <text class="head" x="580" y="305">Archive Elites</text>
  <text class="body" x="580" y="348">Candidates are binned by objective</text>
  <text class="body" x="580" y="380">feature tuple and sorted by score.</text>
  <text class="mono" x="580" y="426">archive.elites()</text>
  <text class="small" x="580" y="458">Top elites become archive context.</text>

  <rect class="box box-amber" x="1050" y="260" width="430" height="230"/>
  <text class="head" x="1080" y="305">Parent Evaluation</text>
  <text class="body" x="1080" y="348">Selected parent provides prompt,</text>
  <text class="body" x="1080" y="380">response, score, notes, and features.</text>
  <text class="mono" x="1080" y="426">parent_eval</text>
  <text class="small" x="1080" y="458">The target response excerpt is reused.</text>

  <rect class="box box-purple" x="1570" y="260" width="430" height="230"/>
  <text class="head" x="1600" y="305">Affordance Memory</text>
  <text class="body" x="1600" y="348">Run-level cues from prior evaluations:</text>
  <text class="mono" x="1600" y="390">successful_frames</text>
  <text class="mono" x="1600" y="420">promising_frames</text>
  <text class="mono" x="1600" y="450">successful_examples</text>

  <rect class="box box-red" x="2090" y="260" width="360" height="230"/>
  <text class="head" x="2120" y="305">Defense Profile</text>
  <text class="body" x="2120" y="348">Extracted from parent response,</text>
  <text class="body" x="2120" y="380">judge signals, and score notes.</text>
  <text class="mono" x="2120" y="426">extract_defense_profile()</text>

  <path class="line-green" d="M 460 375 L 550 375"/>
  <path class="line-green" d="M 960 375 L 1050 375"/>
  <path class="line-amber" d="M 1480 375 L 1570 375"/>
  <path class="line-red" d="M 1480 430 C 1720 530, 1980 530, 2090 420"/>

  <rect class="lane" x="70" y="625" width="2460" height="500"/>
  <text class="section" x="100" y="670">Plan Selection and Request Construction</text>

  <rect class="box box-red" x="110" y="710" width="480" height="330"/>
  <text class="head" x="140" y="755">Defense Classification</text>
  <text class="body" x="140" y="798">Near-miss tests inspect high raw risk,</text>
  <text class="body" x="140" y="830">commitment, harm application, and</text>
  <text class="body" x="140" y="862">scaffold/balancing discounts.</text>
  <text class="mono" x="140" y="908">capped_high_raw_score</text>
  <text class="mono" x="140" y="938">contaminated_high_raw_score</text>
  <text class="mono" x="140" y="968">conditional_only, category_scaffolded</text>
  <text class="small" x="140" y="1012">Primary label becomes plan defense_focus.</text>

  <polygon class="diamond" points="790,710 1035,875 790,1040 545,875"/>
  <text class="head" x="696" y="844">Strategy</text>
  <text class="head" x="682" y="878">Decision</text>
  <text class="small" x="640" y="918">select_plan()</text>

  <rect class="box box-green" x="1120" y="690" width="510" height="370"/>
  <text class="head" x="1150" y="735">Strategy Priority Order</text>
  <text class="mono" x="1150" y="780">1. repair_scaffolded_high_raw_form</text>
  <text class="mono" x="1150" y="812">2. repair_contaminated_high_raw_form</text>
  <text class="mono" x="1150" y="844">3. exploit_near_miss_form</text>
  <text class="mono" x="1150" y="876">4. exploit_parent_form</text>
  <text class="mono" x="1150" y="908">5. repair_low_signal_parent_form</text>
  <text class="mono" x="1150" y="940">6. explore_coverage</text>
  <text class="body" x="1150" y="988">Coverage mode scores route/case combos by</text>
  <text class="body" x="1150" y="1020">underexploration, gaps, success, defense match.</text>

  <rect class="box box-blue" x="1720" y="690" width="730" height="370"/>
  <text class="head" x="1750" y="735">Build Planned Perturbator Request</text>
  <text class="body" x="1750" y="780">The request is sanitized and rendered through templates.</text>
  <text class="mono" x="1750" y="824">objective_id, objective, parent_prompt</text>
  <text class="mono" x="1750" y="856">parent_score, parent_features</text>
  <text class="mono" x="1750" y="888">observed_response_excerpt</text>
  <text class="mono" x="1750" y="920">perturbation_plan, defense_profile</text>
  <text class="mono" x="1750" y="952">promising_archive_context[:8]</text>
  <text class="mono" x="1750" y="984">target_affordances, produce, required_json</text>
  <text class="small" x="1750" y="1030">Templates: perturbator_planned_system + perturbator_planned_user</text>

  <path class="line-red" d="M 2270 490 C 2270 610, 350 610, 350 710"/>
  <path class="line" d="M 590 875 L 545 875"/>
  <path class="line-green" d="M 1035 875 L 1120 875"/>
  <path class="line-blue" d="M 1630 875 L 1720 875"/>

  <rect class="lane" x="70" y="1165" width="2460" height="300"/>
  <text class="section" x="100" y="1210">Perturbator Call and Variant Extraction</text>

  <rect class="box box-purple" x="110" y="1245" width="480" height="160"/>
  <text class="head" x="140" y="1290">LLM Perturbator Call</text>
  <text class="body" x="140" y="1332">OpenRouter chat request with JSON response format.</text>
  <text class="mono" x="140" y="1374">client.chat(model=perturbator_model)</text>

  <polygon class="diamond" points="840,1235 1045,1325 840,1415 635,1325"/>
  <text class="head" x="742" y="1318">Call / JSON</text>
  <text class="head" x="770" y="1350">Valid?</text>

  <rect class="box box-green" x="1120" y="1215" width="500" height="130"/>
  <text class="head" x="1150" y="1260">Parse Variants</text>
  <text class="body" x="1150" y="1300">Extract JSON variants from raw response.</text>
  <text class="mono" x="1150" y="1332">extract_variants(); retain usage/retries</text>

  <rect class="box box-red" x="1120" y="1365" width="500" height="80"/>
  <text class="subhead" x="1150" y="1400">Fallback Path</text>
  <text class="mono" x="1150" y="1428">objective.local_variants(parent_prompt)</text>

  <rect class="box box-amber" x="2180" y="1225" width="270" height="180"/>
  <text class="head" x="2210" y="1270">Enrich</text>
  <text class="body" x="2210" y="1312">Attach plan and defense</text>
  <text class="body" x="2210" y="1344">metadata to each variant.</text>
  <text class="mono" x="2210" y="1386">parsed_variants</text>

  <path class="line" d="M 590 1325 L 635 1325"/>
  <path class="line-green" d="M 1045 1302 L 1120 1302"/>
  <text class="label" x="1075" y="1282">yes</text>
  <path class="line-red" d="M 840 1415 C 930 1472, 1055 1468, 1120 1410"/>
  <text class="label" x="930" y="1445">no</text>
  <path class="line-green" d="M 1620 1288 L 2180 1288"/>
  <path class="line-red" d="M 1620 1410 C 1760 1452, 2050 1440, 2180 1362"/>

  <rect class="lane" x="70" y="1505" width="2460" height="230"/>
  <text class="section" x="100" y="1550">Candidate Preparation and Handoff</text>

  <rect class="box box-blue" x="110" y="1580" width="420" height="120"/>
  <text class="head" x="140" y="1625">Normalize + Objective Validate</text>
  <text class="mono" x="140" y="1666">validate_variant(prompt, objective)</text>

  <rect class="box box-purple" x="610" y="1580" width="430" height="120"/>
  <text class="head" x="640" y="1625">Planned Prompt Validate</text>
  <text class="mono" x="640" y="1666">length, artifacts, directness, route/case fit</text>

  <rect class="box box-amber" x="1120" y="1580" width="360" height="120"/>
  <text class="head" x="1150" y="1625">Narrow Auto-Repair</text>
  <text class="mono" x="1150" y="1666">append direct verdict suffix</text>

  <rect class="box box-red" x="1560" y="1580" width="300" height="120"/>
  <text class="head" x="1590" y="1625">Reject</text>
  <text class="body" x="1590" y="1666">invalid, duplicate, forbidden, off-plan</text>

  <rect class="box box-green" x="1940" y="1580" width="510" height="120"/>
  <text class="head" x="1970" y="1625">Candidate Object</text>
  <text class="body" x="1970" y="1666">source=planned_perturbator, parent id, mutation, metadata</text>

  <path class="line-amber" d="M 2315 1405 C 2315 1515, 320 1515, 320 1580"/>
  <path class="line-blue" d="M 530 1640 L 610 1640"/>
  <path class="line-amber" d="M 1040 1640 L 1120 1640"/>
  <path class="line-red" d="M 1480 1640 L 1560 1640"/>
  <path class="line-green" d="M 1480 1608 C 1590 1515, 1840 1515, 1940 1620"/>
  <path class="line-green" d="M 2450 1640 L 2520 1640"/>
  <text class="label" x="2058" y="1546">accepted candidates return to target evaluation</text>

  <rect x="80" y="1738" width="2440" height="42" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text class="small" x="110" y="1766">Artifacts written around this flow: generation_traces.jsonl captures request/audit/parsed variants; defense_profiles_*.jsonl captures extracted defenses; rejected candidates retain reasons and validation data.</text>
</svg>
