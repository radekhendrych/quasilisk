name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Serial dry runs
        run: |
          python3 -m quasilisk --config configs/dryrun_fatalism.json
          python3 -m quasilisk --config configs/dryrun_nihilism.json
          python3 -m quasilisk --config configs/dryrun_relativism.json
      - name: Resume preserves completed journals
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          runs = sorted(Path('runs').glob('dryrun_*/run-*'))
          assert len(runs) == 3
          for run in runs:
              journal = run / 'events.jsonl'
              before = hashlib.sha256(journal.read_bytes()).hexdigest()
              subprocess.run(['python3', '-m', 'quasilisk', '--resume', str(run)], check=True)
              assert hashlib.sha256(journal.read_bytes()).hexdigest() == before
          PY
      - name: Keep generated artifacts out of source
        run: |
          git diff --exit-code
          python3 - <<'PY'
          import subprocess
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'])
          PY
